<!doctype html>
<html>
  <head>
    <title>Student Registration Form</title>
  </head>
  <body>
    <h2>Roll No: 249XA33167, Name: P.Vishnu Vardhan Reddy</h2>
    <h2>-----  OUTPUT -----</h2>
    <h2 align="center">Student Registration Form</h2>
    
    <form>
      <table border="1" cellpadding="10" align="center">
        <tr>
          <td>Full Name</td>
          <td><input type="text" name="name" /></td>
        </tr>

        <tr>
          <td>Password</td>
          <td><input type="password" name="password" /></td>
        </tr>

        <tr>
          <td>Age</td>
          <td><input type="number" name="age" /></td>
        </tr>

        <tr>
          <td>Date of Birth</td>
          <td><input type="date" name="dob" /></td>
        </tr>

        <tr>
          <td>Gender</td>
          <td>
            <input type="radio" name="gender" /> Male
            <input type="radio" name="gender" /> Female
            <input type="radio" name="gender" /> Other
          </td>
        </tr>

        <tr>
          <td>Hobbies</td>
          <td>
            <input type="checkbox" /> Reading <input type="checkbox" /> Sports
            <input type="checkbox" /> Music <input type="checkbox" /> Coding
          </td>
        </tr>

        <tr>
          <td>Branch</td>
          <td>
            <select>
              <option>CSE</option>
              <option>CSE (AI & ML)</option>
              <option>ECE</option>
              <option>EEE</option>
              <option>Mechanical</option>
              <option>Civil</option>
            </select>
          </td>
        </tr>

        <tr>
          <td>Address</td>
          <td>
            <textarea rows="4" cols="30"></textarea>
          </td>
        </tr>

        <tr>
          <td colspan="2" align="center">
            <input type="submit" value="Submit" />
            <input type="reset" value="Reset" />
          </td>
        </tr>
      </table>
    </form>
    <h2>----- END of the OUTPUT -----</h2>
    <h2>Roll No: 249XA33167, Name: P.Vishnu Vardhan Reddy</h2>
  </body>
</html>
