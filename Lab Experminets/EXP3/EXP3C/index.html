<!doctype html>
<html>
  <head>
    <title>Types of CSS</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      h2 {
        color: rgb(14, 240, 108);
        text-align: center;
      }

      p {
        color: rgb(250, 69, 175);
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <h2>Roll No: 249XA33167, Name: P.Vishnu Vardhan Reddy</h2>
    <h2>Internal CSS Example</h2>

    <p>This paragraph uses Internal CSS.</p>

    <h3 style="color: red; text-align: center">
      This heading uses Inline CSS.
    </h3>

    <h1>This heading uses External CSS.</h1>
    <h2>----- END of the OUTPUT -----</h2>
    <h2>Roll No: 249XA33167, Name: P.Vishnu Vardhan Reddy</h2>
  </body>
</html>
